name: release

# v1.0.0 처럼 v로 시작하는 태그를 올리면 exe를 만들어 Releases 에 붙인다.
#   git tag v1.0.0
#   git push origin v1.0.0
on:
  push:
    tags: ['v*']
  workflow_dispatch:        # 깃헙 Actions 탭에서 손으로 돌릴 수도 있다

permissions:
  contents: write           # Release 를 만들려면 필요

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # CHANGELOG.md 에서 이번 태그에 해당하는 항목만 뽑아 릴리스 설명을 만든다.
      # 빌드보다 먼저 해서, 항목을 안 적었으면 바로 알 수 있게 한다.
      - name: 릴리스 설명 만들기
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $buf = @(); $take = $false
          foreach ($l in (Get-Content CHANGELOG.md -Encoding utf8)) {
            if ($l -match '^## v\d+\.\d+\.\d+\s*$') {
              if ($take) { break }
              $take = ($l.Trim() -eq "## $tag")
              continue
            }
            if ($take) { $buf += $l }
          }
          $sec = ($buf -join "`n").Trim()
          if (-not $sec) {
            throw "CHANGELOG.md 에 '## $tag' 항목이 없습니다. 항목을 적고 태그를 다시 올려주세요."
          }
          $foot = (Get-Content .github/release-footer.md -Encoding utf8) -join "`n"
          "## 이번 버전에서 바뀐 것`n`n$sec`n`n---`n`n$foot" | Out-File release-notes.md -Encoding utf8
          Write-Host "--- 릴리스 설명 ---"
          Get-Content release-notes.md

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # .NET 런타임과 OpenCV 네이티브까지 전부 넣은 단일 exe
      - name: 빌드
        run: >
          dotnet publish -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o publish

      - name: 확인
        run: |
          dir publish
          if (-not (Test-Path publish/ImageMacro.exe)) { throw "exe 가 안 만들어졌습니다" }
        shell: pwsh

      - uses: softprops/action-gh-release@v2
        with:
          files: publish/ImageMacro.exe
          draft: false
          generate_release_notes: true
          body_path: release-notes.md
