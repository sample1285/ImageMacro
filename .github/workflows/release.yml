name: release

# v1.0.0 처럼 v로 시작하는 태그를 올리면 exe를 만들어 Releases 에 붙인다.
#   git tag v1.0.0
#   git push origin v1.0.0
on:
  push:
    tags: ['v*']
  workflow_dispatch:        # 깃헙 Actions 탭에서 손으로 돌릴 수도 있다

permissions:
  contents: write           # Release 를 만들려면 필요

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # .NET 런타임과 OpenCV 네이티브까지 전부 넣은 단일 exe
      - name: 빌드
        run: >
          dotnet publish -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o publish

      - name: 확인
        run: |
          dir publish
          if (-not (Test-Path publish/ImageMacro.exe)) { throw "exe 가 안 만들어졌습니다" }
        shell: pwsh

      - uses: softprops/action-gh-release@v2
        with:
          files: publish/ImageMacro.exe
          draft: false
          generate_release_notes: true
          body: |
            ### 내려받기

            아래 `ImageMacro.exe` 를 받아서 실행하면 됩니다.

            - **.NET 설치가 필요 없습니다.** 런타임이 exe 안에 들어 있습니다.
            - 첫 실행은 압축을 푸느라 10~20초 걸릴 수 있습니다. 두 번째부터는 빠릅니다.
            - 윈도우 SmartScreen 경고가 뜨면 `추가 정보` → `실행` 을 누르세요.
              (코드 서명 인증서가 없어서 뜨는 경고입니다)
